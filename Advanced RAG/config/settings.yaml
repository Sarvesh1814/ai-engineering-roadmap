app:
  env: development
  log_level: INFO

mysql:
  host: localhost
  port: 3306
  database: servicenow
  user: root
  password: ""  # Set via MYSQL_PASSWORD env var
  ingestion_view: vw_ops_workitem_ingestion  # Solved tickets — used by ingestion pipeline
  resolver_view: vw_ops_workitem_resolve         # Open tickets — used by resolver/polling
  batch_size: 1000

qdrant:
  host: localhost
  port: 6333
  collection: AgenticRag
  vector_size: 768
  distance: COSINE

embedding:
  provider: bge
  model: BAAI/bge-large-en-v1.5
  normalize: true
  batch_size: 32

llm:
  provider: open-ai
  model_name: opshub-llm
  base_url: http://10.13.27.249:4001/v1/chat/completions
  api_key: ""  # Set via LLM_API_KEY env var
  temperature: 0.1

reranker:
  model: BAAI/bge-reranker-base

retrieval:
  dense_top_k: 50
  sparse_top_k: 50
  rerank_top_k: 10
  final_ticket_count: 5

chunking:
  chunk_size: 450
  chunk_overlap: 60
  min_chunk_size: 100

ingestion:
  mysql_batch_size: 1000
  embedding_batch_size: 32
  checkpoint_file: ".ingestion_checkpoint"
  failure_log: ".ingestion_failures.jsonl"
  bm25_index_path: ".bm25_index.json"
  knowledge_version: 1  # Bump this whenever the extraction prompt or schema changes